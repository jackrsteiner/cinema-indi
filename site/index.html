<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinema Indi</title>
<meta name="description" content="Films worth watching together.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9E%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Cinema Indi</h1>
    <p class="tagline">Films worth watching together. <a class="plain-link" href="list.html">Plain list</a></p>
  </div>
  <div id="legend" class="legend" aria-label="Severity legend"></div>
</header>
<div class="bar">
  <div class="controls">
    <nav class="modes" aria-label="Sort order">
      <button data-mode="alpha" aria-pressed="true">A–Z</button>
      <button data-mode="year" aria-pressed="false">Year</button>
      <button data-mode="age" aria-pressed="false">Age</button>
    </nav>
    <nav class="modes filters" aria-label="Show only">
      <button data-filter="unwatched" aria-pressed="false">Unwatched</button>
      <button data-filter="watched" aria-pressed="false">Watched</button>
    </nav>
  </div>
  <nav class="jump" id="jump" aria-label="Jump to section"></nav>
</div>
<main id="main">
  <p class="empty" id="loading">Loading…</p>
</main>
<footer class="foot">
  <p id="foot-note"></p>
</footer>
<script src="app.js"></script>
</body>
</html>
